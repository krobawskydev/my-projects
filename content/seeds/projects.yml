projects:
  - title: Banca Movil BCP
    slug: banca-movil-bcp
    short_description: Mobile banking application work for one of Peru's leading banks, focused on digital payments and scalable modular iOS flows.
    content: >
      Banca Movil BCP is the mobile banking application of one of the leading
      banks in Peru. The project involved development and maintenance of iOS
      features using Swift 5 and UIKit, work on a modular repository composed
      of a main application and reusable submodules, and delivery of digital
      payment and financial operation flows within the SDPO team.
    cover_image: https://yt3.googleusercontent.com/6OWD-UzDY_tY3sriVivgIZZ6S68G1x6La0YQht37QfbMq4pk3-5paL260zQ5cOs-JXLvrfbj=s900-c-k-c0x00ffffff-no-rj
    gallery: []
    github_url: ''
    live_url: ''
    featured: true
    project_type: enterprise
    role: Senior iOS Developer
    company: NTT DATA
    duration: 2022 - 2024
    team_size:
    published: true
    display_order: 1
    highlights:
      - Developed and maintained iOS features using Swift 5 and UIKit.
      - Worked on a modular repository with a main app and reusable submodules.
      - Built independent modules for cross-cutting banking flows.
      - Participated in the SDPO team focused on digital payments and financial operations.
      - Implemented VIPER plus Coordinator for separation of concerns and decoupled navigation.
      - Built complex UIKit interfaces with Auto Layout and reusable custom components.
      - Integrated REST APIs documented in Swagger UI.
      - Applied SOLID principles, unit testing, and code quality practices with SonarQube.
      - Collaborated under Scrum with QA, backend, architects, and product owners.
      - Managed Bitbucket workflows, Jenkins pipelines, IPA generation, and Confluence documentation.
    translations:
      es:
        title: Banca Movil BCP
        short_description: Trabajo en la aplicacion de banca movil de uno de los principales bancos del Peru, enfocado en pagos digitales y flujos iOS modulares y escalables.
        content: >
          Banca Movil BCP es la aplicacion de banca movil de uno de los
          principales bancos del Peru. El proyecto incluyo desarrollo y
          mantenimiento de funcionalidades iOS usando Swift 5 y UIKit,
          trabajo sobre un repositorio modular compuesto por una aplicacion
          principal y submodulos reutilizables, y entrega de flujos de pagos
          digitales y operaciones financieras dentro del equipo SDPO.
        role: Desarrollador iOS Senior
        company: NTT DATA
        duration: 2022 - 2024
        highlights:
          - Desarrollo y mantenimiento de funcionalidades iOS usando Swift 5 y UIKit.
          - Trabajo sobre un repositorio modular con una aplicacion principal y submodulos reutilizables.
          - Construccion de modulos independientes para flujos transversales de banca.
          - Participacion en el equipo SDPO enfocado en pagos digitales y operaciones financieras.
          - Implementacion de VIPER junto con Coordinator para separacion de responsabilidades y navegacion desacoplada.
          - Construccion de interfaces complejas con UIKit, Auto Layout y componentes custom reutilizables.
          - Integracion de APIs REST documentadas en Swagger UI.
          - Aplicacion de principios SOLID, pruebas unitarias y calidad de codigo con SonarQube.
          - Trabajo colaborativo bajo Scrum con QA, backend, arquitectos y product owners.
          - Gestion de Bitbucket, pipelines en Jenkins, generacion de IPAs y documentacion en Confluence.
    technologies:
      - Swift
      - UIKit
      - iOS
      - VIPER
      - REST APIs
      - Jira
      - Confluence
      - Jenkins
      - SonarQube
      - Bitbucket
      - Xcode

  - title: Caja Huancayo
    slug: caja-huancayo
    short_description: Native iOS work for the technological modernization of a financial application, migrating from a web-exported solution to a modern mobile experience.
    content: >
      Caja Huancayo is a technological modernization project for a financial
      application, migrating a previous web-exported solution for iOS and
      Android into a native mobile application while preserving a shared
      foundation through Kotlin Multiplatform. The work focused on native iOS
      development with SwiftUI, better mobile UX, secure banking flows, and
      iterative collaboration with the client.
    cover_image: https://yt3.googleusercontent.com/ytc/AIdro_lLpmdnfHAGcBbQWZjpKtnR5Y9_6DdkS2liWcdlEAw9Ng=s900-c-k-c0x00ffffff-no-rj
