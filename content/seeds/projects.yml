      - Reused Data and Domain layers across iOS and Android with Kotlin Multiplatform.
      - Participated in the functional migration from a hybrid web app to a native mobile solution.
      - Improved UI and UX according to modern mobile and financial product standards.
      - Integrated REST APIs for banking operations.
      - Applied security best practices aligned with the OWASP Top 10.
      - Collaborated frequently with the client to refine user stories and define requirements.
      - Deployed and validated builds through TestFlight.
      - Worked under Scrum with iterative delivery and continuous feedback.
